name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install test dependencies (no camera / audio / PyTorch)
        run: |
          python -m pip install --upgrade pip
          pip install numpy opencv-python-headless pyyaml python-dotenv requests pypdf reportlab \
                      onnxruntime scikit-learn joblib pandas pytest
      - name: Build knowledge base
        run: python scripts/build_manual.py
      - name: Unit tests
        run: python -m pytest -q tests
      - name: Download + convert detectors (torch-free) and run model tests
        run: |
          python scripts/setup_models.py --skip-hands --skip-speech --skip-knowledge
          python -m pytest -q tests/test_models.py
